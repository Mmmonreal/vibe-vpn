<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe VPN</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0D0E15;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .header { text-align: center; }
        .title { font-size: 28px; font-weight: bold; letter-spacing: 2px; margin: 0; }
        .status { font-size: 14px; color: #6C5CE7; margin-top: 8px; font-weight: 600; letter-spacing: 1px; }
        .power-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #6C5CE7;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.4);
            transition: all 0.2s ease;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .power-icon { width: 70px; height: 70px; fill: #FFFFFF; }
        .footer-info {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">VIBE VPN</h1>
        <div class="status" id="status-text">НАЖМИ ДЛЯ ПОЛУЧЕНИЯ КЛЮЧА</div>
    </div>

    <button class="power-btn" id="main-btn">
        <svg class="power-icon" viewBox="0 0 24 24">
            <path d="M16.56,5.44L15.11,6.89C16.84,8.27 18,10 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12C6,10 7.16,8.27 8.88,6.88L7.44,5.44C5.36,7.3 4,10 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12C20,10 18.64,7.3 16.56,5.44M11,3H13V11H11V3Z"/>
        </svg>
    </button>

    <div class="footer-info">🌐 Германия (Основной)</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем Telegram, что приложение готово
        tg.expand();

        const btn = document.getElementById('main-btn');
        const statusText = document.getElementById('status-text');

        // Обработчик клика
        btn.addEventListener('click', function() {
            // 1. Сразу меняем цвет кнопки на зеленый для визуала
            btn.style.backgroundColor = '#00B894';
            btn.style.boxShadow = '0 0 40px rgba(0, 184, 148, 0.6)';
            statusText.innerText = 'ОТПРАВКА ЗАПРОСА...';
            statusText.style.color = '#00B894';

            // 2. Отправляем строку боту
            try {
                tg.sendData("generate_vpn_key");
            } catch (e) {
                alert("Ошибка отправки данных: " + e.message);
            }

            // 3. Закрываем окно чуть позже, чтобы пользователь увидел смену цвета
            setTimeout(() => {
                tg.close();
            }, 500);
        });
    </script>
</body>
</html>
